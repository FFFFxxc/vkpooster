<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
/* Премиальная темная тема */
:root {
  --vkr-bg-main: #1c1c1e;
  --vkr-bg-section: #2c2c2e;
  --vkr-accent: #0077ff;
  --vkr-accent-hover: #005ce6;
  --vkr-text-main: #f5f5f5;
  --vkr-text-muted: #a1a1aa;
  --vkr-border: rgba(255, 255, 255, 0.08);
  --vkr-radius: 10px;
  --vkr-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 380px; background: var(--vkr-bg-main); color: var(--vkr-text-main); font-family: var(--vkr-font); font-size: 13px; padding: 20px; }

.hdr { text-align: center; font-size: 18px; font-weight: 600; margin-bottom: 20px; letter-spacing: -0.3px; }
.sec { margin-bottom: 16px; background: var(--vkr-bg-section); padding: 16px; border-radius: var(--vkr-radius); border: 1px solid var(--vkr-border); }
.lbl { display: block; font-size: 11px; color: var(--vkr-text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; font-weight: 600; }

/* Список аккаунтов */
.accounts-list { margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
.account-item { display: flex; align-items: center; padding: 10px; background: var(--vkr-bg-section); border: 1px solid var(--vkr-border); border-radius: var(--vkr-radius); transition: 0.2s; }
.account-item:hover { border-color: rgba(255, 255, 255, 0.15); }
.account-avatar { width: 36px; height: 36px; border-radius: 50%; margin-right: 12px; border: 1px solid var(--vkr-border); }
.account-info { flex: 1; display: flex; flex-direction: column; }
.account-name { font-weight: 600; color: var(--vkr-text-main); font-size: 13px; margin-bottom: 2px; }
.account-role { font-size: 11px; color: var(--vkr-accent); font-weight: 500; }
.account-role.bot { color: var(--vkr-text-muted); }

.account-actions { display: flex; gap: 6px; align-items: center; }

.btn-make-primary { background: rgba(255, 193, 7, 0.1); color: #ffc107; border: none; border-radius: 6px; width: 28px; height: 28px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.btn-make-primary:hover { background: #ffc107; color: #1c1c1e; transform: scale(1.1); }

.btn-delete-acc { background: rgba(239, 83, 80, 0.1); color: #ef5350; border: none; border-radius: 6px; width: 28px; height: 28px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.btn-delete-acc:hover { background: #ef5350; color: #fff; }

/* Инпуты и кнопки */
input[type="password"], input[type="text"], select { width: 100%; padding: 10px 14px; background: rgba(0,0,0,0.2); border: 1px solid var(--vkr-border); border-radius: var(--vkr-radius); color: var(--vkr-text-main); font-size: 13px; outline: none; margin-bottom: 8px; transition: 0.2s; }
input:focus, select:focus { border-color: var(--vkr-accent); box-shadow: 0 0 0 2px rgba(0, 119, 255, 0.2); }

.btn { width: 100%; padding: 12px; border: none; border-radius: var(--vkr-radius); font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
.btn.primary { background: var(--vkr-accent); color: #fff; }
.btn.primary:hover { background: var(--vkr-accent-hover); transform: translateY(-1px); }
.btn.success { background: #34c759; color: #fff; }
.btn.success:hover { background: #2ebd4e; }
.btn-secondary { width: 100%; padding: 10px; background: transparent; color: var(--vkr-accent); border: 1px solid var(--vkr-accent); border-radius: var(--vkr-radius); font-size: 13px; cursor: pointer; font-weight: 600; margin-top: 6px; }
.btn-secondary:hover { background: rgba(0, 119, 255, 0.1); }

.info { font-size: 12px; color: var(--vkr-text-muted); margin-top: 12px; line-height: 1.5; text-align: center; }
.error-msg { color: #ef5350; font-size: 11px; margin-top: 8px; text-align: center; display: none; }

/* Тумблеры */
.autolike-toggle { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
.toggle { position: relative; width: 44px; height: 24px; }
.toggle input { opacity: 0; width: 0; height: 0; margin: 0; }
.toggle-slider { position: absolute; inset: 0; background: rgba(255,255,255,0.1); border-radius: 24px; transition: .3s; cursor: pointer; }
.toggle-slider::before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .3s; }
.toggle input:checked + .toggle-slider { background: #34c759; }
.toggle input:checked + .toggle-slider::before { transform: translateX(20px); }

.groups-list { max-height: 180px; overflow-y: auto; border: 1px solid var(--vkr-border); border-radius: var(--vkr-radius); margin: 8px 0; background: rgba(0,0,0,0.1); }
.group-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; border-bottom: 1px solid var(--vkr-border); }
.group-item:hover { background: rgba(255,255,255,0.05); }
.group-item img { border-radius: 50%; width: 24px; height: 24px; }
.group-item input { width: auto; margin: 0; }
.radio-group label { display: block; margin: 6px 0; cursor: pointer; font-size: 12px; }
.stats-block { margin-top: 12px; padding: 12px; background: rgba(0,0,0,0.2); border-radius: var(--vkr-radius); color: var(--vkr-text-muted); line-height: 1.6; font-size: 12px; }
.stats-block strong { color: var(--vkr-text-main); }
hr { border: none; border-top: 1px solid var(--vkr-border); margin: 20px 0; }
.divider { text-align: center; color: var(--vkr-text-muted); font-size: 11px; margin: 10px 0; }
</style>
</head>
<body>

<div class="hdr">🔑 VK Reposter Pro</div>

<!-- Блок с аккаунтами -->
<div id="accounts-container" class="accounts-list">
  <!-- Сюда JS вставит аккаунты -->
</div>

<!-- Добавление аккаунта -->
<div class="sec" id="add-account-sec">
  <div class="lbl">Добавить аккаунт</div>
  <button class="btn primary" id="auth-btn" style="margin-bottom: 10px;">🔐 Вход через ВКонтакте</button>
  <div class="divider">или</div>
  <input type="password" id="token-input" placeholder="Вставьте токен...">
  <button class="btn success" id="save-btn">💾 Сохранить токен</button>
  <div id="auth-error" class="error-msg"></div>
</div>

<div class="info">
  Первый аккаунт используется для репостов. Остальные помогают ставить автолайки. Нажмите ⭐ чтобы сделать аккаунт основным.
</div>

<!-- Автолайки -->
<div id="autolike-section" style="display:none">
  <hr>
  <div class="hdr" style="font-size: 16px; margin-bottom: 12px;">❤️ Ферма Автолайков</div>
  
  <div class="autolike-toggle">
    <label class="toggle">
      <input type="checkbox" id="autolike-enabled">
      <span class="toggle-slider"></span>
    </label>
    <span id="autolike-status-text">Выключено</span>
  </div>
  
  <div id="autolike-settings" style="display:none">
    <div class="sec">
      <div class="lbl">Интервал проверки:</div>
      <select id="autolike-interval">
        <option value="5">5 минут</option>
        <option value="10" selected>10 минут</option>
        <option value="15">15 минут</option>
        <option value="30">30 минут</option>
        <option value="60">1 час</option>
      </select>
    </div>
    
    <div class="sec">
      <div class="lbl">Лайкать:</div>
      <div class="radio-group">
        <label><input type="radio" name="autolike-filter" value="owner" checked> Только от имени группы</label>
        <label><input type="radio" name="autolike-filter" value="all"> Все посты</label>
      </div>
    </div>
    
    <div class="sec">
      <div class="lbl">Мои группы:</div>
      <input type="text" id="autolike-search" placeholder="🔍 Поиск...">
      <div id="autolike-groups-list" class="groups-list"></div>
    </div>
    
    <button id="autolike-save" class="btn primary">💾 Сохранить настройки</button>
    <button id="autolike-run-now" class="btn-secondary">▶️ Проверить сейчас</button>
    
    <div id="autolike-stats" class="stats-block">
      <div>❤️ Сегодня лайков: <strong id="stat-today">0</strong></div>
      <div>📊 Всего лайков: <strong id="stat-total">0</strong></div>
      <div>🕐 Последняя проверка: <span id="stat-last-check">—</span></div>
    </div>
  </div>
</div>

<script src="popup-auth.js"></script>
</body>
</html>
