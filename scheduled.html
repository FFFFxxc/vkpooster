<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Отложка — VK Reposter Pro</title>
  <link rel="stylesheet" href="scheduled.css">
  <link rel="stylesheet" href="scheduled-fixes.css">
</head>
<body>
  <header class="topbar">
    <div><span class="eyebrow">VK Reposter Pro</span><h1>Публикации и отложка</h1><p>Все локальные и серверные очереди в одном месте</p></div>
    <div class="head-actions"><button id="new-story">＋ История</button><button id="new-clips">＋ Клипы</button><button id="refresh">Обновить</button><button id="settings">Настройки</button></div>
  </header>
  <main>
    <section id="pause-alert" class="pause-alert" hidden><div><b>VK остановил локальную очередь</b><p id="pause-message"></p></div><button id="resume">Продолжить после ручной проверки</button></section>
    <section class="summary">
      <article><span>Ожидают выбора</span><b id="sum-waiting">0</b></article><article><span>Посты в работе</span><b id="sum-posts">0</b></article><article><span>Комментарии</span><b id="sum-comments">0</b></article><article><span>Истории</span><b id="sum-stories">0</b></article><article><span>Клипы</span><b id="sum-clips">0</b></article>
    </section>
    <nav class="tabs">
      <button class="active" data-tab="waiting">Ожидания <span id="badge-waiting">0</span></button>
      <button data-tab="posts">Посты <span id="badge-posts">0</span></button>
      <button data-tab="comments">Комментарии <span id="badge-comments">0</span></button>
      <button data-tab="stories">Истории <span id="badge-stories">0</span></button>
      <button data-tab="clips">Клипы <span id="badge-clips">0</span></button>
      <button data-tab="history">История <span id="badge-history">0</span></button>
    </nav>
    <section class="toolbar"><div><h2 id="section-title">Ожидания</h2><p id="section-hint">Посты, которые вы отметили во ВКонтакте</p></div><button id="clear-finished" hidden>Очистить готовые</button></section>
    <section id="cards" class="cards"></section>
  </main>

  <dialog id="publish-dialog">
    <form id="publish-form" class="dialog-body">
      <div class="dialog-head"><div><span>Публикация из ожиданий</span><h2>Куда и когда отправить пост</h2></div><button type="button" id="close-dialog">×</button></div>
      <div id="dialog-preview" class="dialog-preview"></div>
      <fieldset><legend>Сообщества</legend><div id="publish-groups" class="groups"></div></fieldset>
      <div class="form-grid"><label><span>Режим</span><select id="publish-mode"><option value="copy">Копировать пост</option><option value="repost">Оригинальный репост</option></select></label><label><span>Дата (пусто = сейчас)</span><input id="publish-date" type="datetime-local"></label></div>
      <label><span>Текст поста</span><textarea id="publish-text" rows="4"></textarea></label>
      <label><span>Комментарий после публикации</span><textarea id="publish-comment" rows="3" placeholder="Необязательно"></textarea></label>
      <button id="publish-submit" class="primary" type="submit">Поставить в очередь</button>
    </form>
  </dialog>
  <div id="toast" class="toast" hidden></div>
  <script src="extension-server-client.js"></script><script src="scheduled.js"></script>
</body>
</html>
